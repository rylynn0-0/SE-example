# ============================================================
# Nginx 配置：既托管 Vue 构建出的静态文件，又充当后端的反向代理
#
# 这就替代了开发环境下 Vite 的 proxy：
# 浏览器只认识 8081 这一个地址，/api 的请求由 Nginx 内部转发给后端，
# 因此前端代码里的接口路径同样写成 /api/... 即可，无需任何改动。
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 开启 gzip，压缩 JS/CSS/JSON，明显减少首次加载体积
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---------- 后端 REST 接口 ----------
    # ^~ 表示该前缀匹配后不再尝试正则匹配，避免被下面的正则 location 抢走
    # proxy_pass 后面没有写 URI，因此会原样透传 /api/tasks 这个完整路径
    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Knife4j 接口文档 ----------
    # doc.html 是文档页面，webjars/ 与 v3/api-docs 是它依赖的静态资源与规范 JSON
    location ~ ^/(doc\.html|webjars/|v3/api-docs|swagger-ui|swagger-resources) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------- 前端单页应用 ----------
    # 先尝试找同名静态文件，找不到就回退到 index.html，
    # 这样刷新任意前端路由都不会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存策略：文件名带 hash 的资源可以长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
