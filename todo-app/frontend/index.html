<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待办清单 · Vue3 + Spring Boot 全栈示例</title>
  </head>
  <body>
    <!-- Vue 应用的挂载点：main.js 里 app.mount('#app') 会把根组件渲染到这里 -->
    <div id="app"></div>
    <!-- Vite 入口脚本，type="module" 让浏览器以 ES Module 方式加载 -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
